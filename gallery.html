<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="gallery-container">
        <h1>Interactive Image Gallery</h1>
        
        <!-- Filter Categories (Bonus Feature) -->
        <div class="filter-buttons">
            <button class="btn active" onclick="filterImages('all')">All</button>
            <button class="btn" onclick="filterImages('nature')">Nature</button>
            <button class="btn" onclick="filterImages('tech')">Tech</button>
            <button class="btn" onclick="filterImages('architecture')">Architecture</button>
        </div>

        <!-- Image Grid -->
        <div class="image-grid">
            <div class="gallery-item nature">
                <img src="https://images.unsplash.com/photo-1472214222541-d510753a8707?w=500" alt="Nature 1">
            </div>
            <div class="gallery-item tech">
                <img src="https://images.unsplash.com/photo-1518770660439-4636190af475?w=500" alt="Tech 1">
            </div>
            <div class="gallery-item architecture">
                <img src="https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?w=500" alt="Architecture 1">
            </div>
            <div class="gallery-item nature">
                <img src="https://images.unsplash.com/photo-1501854140801-50d01698950b?w=500" alt="Nature 2">
            </div>
            <div class="gallery-item tech">
                <img src="https://images.unsplash.com/photo-1550751827-4bd374c3f58b?w=500" alt="Tech 2">
            </div>
            <div class="gallery-item architecture">
                <img src="https://images.unsplash.com/photo-1449034446853-66c86144b0ad?w=500" alt="Architecture 2">
            </div>
        </div>
    </div>

    <!-- Lightbox Modal Box (Pop-up view) -->
    <div id="lightbox" class="lightbox">
        <span class="close-btn" onclick="closeLightbox()">&times;</span>
        <button class="prev-btn" onclick="changeImage(-1)">&#10094;</button>
        <img id="lightbox-img" src="" alt="Popup View">
        <button class="next-btn" onclick="changeImage(1)">&#10095;</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
