<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard Quiz App</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f7f9fc;
            margin: 0;
            padding: 20px;
            text-align: center;
            color: #333;
        }
        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        /* Flashcard Main Box */
        .flashcard-box {
            background: linear-gradient(135deg, #11998e, #38ef7d);
            color: white;
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: bold;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            cursor: pointer;
        }
        .flashcard-box.answer-mode {
            background: linear-gradient(135deg, #f857a6, #ff5858);
        }
        /* Buttons styling */
        button {
            padding: 10px 18px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .nav-btn { background-color: #007bff; color: white; }
        .action-btn { background-color: #6c757d; color: white; }
        .delete-btn { background-color: #dc3545; color: white; }
        .save-btn { background-color: #28a745; color: white; width: 100%; margin-top: 10px; }
        button:hover { opacity: 0.9; }
        
        /* Form Section */
        .form-section {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 2px dashed #eee;
            text-align: left;
        }
        input, textarea {
            width: 95%;
            padding: 10px;
            margin: 5px 0 12px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Flashcard Quiz App 🧠</h2>
    <p id="card-counter">Card 1 of 3</p>

    <!-- The Flashcard Display Area -->
    <div class="flashcard-box" id="flashcard" onclick="toggleFlip()">
        Click "Show Answer" to reveal!
    </div>

    <!-- Navigation and Card Flip Controls -->
    <div>
        <button class="action-btn" onclick="toggleFlip()">Show Answer / Flip</button>
        <br><br>
        <button class="nav-btn" onclick="prevCard()">← Previous</button>
        <button class="nav-btn" onclick="nextCard()">Next →</button>
    </div>

    <div>
        <button class="action-btn" onclick="editCard()">Edit Current Card</button>
        <button class="delete-btn" onclick="deleteCard()">Delete Card</button>
    </div>

    <!-- Form Section to Add/Edit Cards -->
    <div class="form-section">
        <h3 id="form-title">Add New Flashcard</h3>
        <label><b>Question (Front Side):</b></label>
        <input type="text" id="inputQuestion" placeholder="Enter question...">
        
        <label><b>Answer (Back Side):</b></label>
        <textarea id="inputAnswer" rows="3" placeholder="Enter answer..."></textarea>
        
        <button class="save-btn" onclick="saveCard()">Save Flashcard</button>
    </div>
</div>

<script>
    // Initial default set of flashcards
    let flashcards = [
        { q: "What is the capital of Pakistan?", a: "Islamabad" },
        { q: "What does HTML stand for?", a: "HyperText Markup Language" },
        { q: "Which language is used for styling web pages?", a: "CSS (Cascading Style Sheets)" }
    ];

    let currentIndex = 0;
    let isShowingQuestion = true;
    let editIndex = null; // To track if we are editing an existing card

    // Display updates
    function updateCardDisplay() {
        const cardDisplay = document.getElementById('flashcard');
        const counter = document.getElementById('card-counter');
        
        if (flashcards.length === 0) {
            counter.innerHTML = "No cards available";
            cardDisplay.innerHTML = "Please add a new flashcard below!";
            cardDisplay.className = "flashcard-box";
            return;
        }

        counter.innerHTML = `Card ${currentIndex + 1} of ${flashcards.length}`;
        
        if (isShowingQuestion) {
            cardDisplay.innerHTML = `<b>Q:</b> ${flashcards[currentIndex].q}`;
            cardDisplay.className = "flashcard-box";
        } else {
            cardDisplay.innerHTML = `<b>A:</b> ${flashcards[currentIndex].a}`;
            cardDisplay.className = "flashcard-box answer-mode";
        }
    }

    // Flip Card Logic
    function toggleFlip() {
        if (flashcards.length === 0) return;
        isShowingQuestion = !isShowingQuestion;
        updateCardDisplay();
    }

    // Navigation Controls
    function nextCard() {
        if (flashcards.length === 0) return;
        currentIndex = (currentIndex + 1) % flashcards.length;
        isShowingQuestion = true;
        updateCardDisplay();
    }

    function prevCard() {
        if (flashcards.length === 0) return;
        currentIndex = (currentIndex - 1 + flashcards.length) % flashcards.length;
        isShowingQuestion = true;
        updateCardDisplay();
    }

    // Add or Update Card Logic
    function saveCard() {
        const qText = document.getElementById('inputQuestion').value.trim();
        const aText = document.getElementById('inputAnswer').value.trim();

        if (qText === "" || aText === "") {
            alert("Please fill both question and answer fields!");
            return;
        }

        if (editIndex !== null) {
            // Update existing card
            flashcards[editIndex] = { q: qText, a: aText };
            editIndex = null;
            document.getElementById('form-title').innerHTML = "Add New Flashcard";
            alert("Flashcard updated successfully!");
        } else {
            // Add new card
            flashcards.push({ q: qText, a: aText });
            currentIndex = flashcards.length - 1; // Go to the newly added card
            alert("New flashcard added!");
        }

        // Clear input form fields
        document.getElementById('inputQuestion').value = "";
        document.getElementById('inputAnswer').value = "";
        
        isShowingQuestion = true;
        updateCardDisplay();
    }

    // Edit Card Setup
    function editCard() {
        if (flashcards.length === 0) return;
        document.getElementById('form-title').innerHTML = "Edit Current Flashcard";
        document.getElementById('inputQuestion').value = flashcards[currentIndex].q;
        document.getElementById('inputAnswer').value = flashcards[currentIndex].a;
        editIndex = currentIndex;
    }

    // Delete Card Logic
    function deleteCard() {
        if (flashcards.length === 0) return;
        
        if (confirm("Are you sure you want to delete this flashcard?")) {
            flashcards.splice(currentIndex, 1);
            // Adjust index after deletion
            if (currentIndex >= flashcards.length && flashcards.length > 0) {
                currentIndex = flashcards.length - 1;
            }
            isShowingQuestion = true;
            updateCardDisplay();
        }
    }

    // Initialize layout on page start
    updateCardDisplay();
</script>

</body>
</html>
